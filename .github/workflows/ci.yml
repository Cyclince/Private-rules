name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fail on high+)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:shared
      - run: pnpm test:domain
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:api
      - run: pnpm test:telegram
      - name: Install pinned mihomo and validate compiled configs
        env:
          # Bump MIHOMO_SHA256 together whenever MIHOMO_VERSION is upgraded.
          MIHOMO_VERSION: v1.19.2
          MIHOMO_SHA256: a0b2b347b30387c452e6a4cf531f55df8175f7998e91451a3083459948aa3cae
        run: |
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz" -o /tmp/mihomo.gz
          echo "${MIHOMO_SHA256}  /tmp/mihomo.gz" | sha256sum -c -
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
          MIHOMO_BIN=/tmp/mihomo REQUIRE_MIHOMO_KERNEL=1 pnpm exec vitest run tests/domain/compilers/mihomo-kernel.test.ts
      - name: Install pinned sing-box and validate compiled configs
        env:
          # Bump SINGBOX_SHA256 together whenever SINGBOX_VERSION is upgraded.
          SINGBOX_VERSION: v1.12.25
          SINGBOX_SHA256: a1ec76e2b6b139eb747a1b1ebee7d14b8d4be5a833596cad8070a31ef960301f
        run: |
          SINGBOX_VER_NO_V="${SINGBOX_VERSION#v}"
          ARCHIVE="sing-box-${SINGBOX_VER_NO_V}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          echo "${SINGBOX_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          chmod +x "/tmp/sing-box-${SINGBOX_VER_NO_V}-linux-amd64/sing-box"
          "/tmp/sing-box-${SINGBOX_VER_NO_V}-linux-amd64/sing-box" version
          SINGBOX_BIN="/tmp/sing-box-${SINGBOX_VER_NO_V}-linux-amd64/sing-box" REQUIRE_SINGBOX_KERNEL=1 pnpm exec vitest run tests/domain/compilers/singbox-kernel.test.ts
      - run: pnpm build
      - name: Enforce bundle size budgets
        run: pnpm size
      - run: pnpm wrangler deploy --dry-run --keep-vars
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Compatibility check on the newest Node release (1.0.6 broke on it).
  node-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.1 }
      - uses: actions/setup-node@v4
        with: { node-version: current, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-admin-password
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      RULE_TOKEN: ci-rule-token
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build --tag private-rules:ci .
