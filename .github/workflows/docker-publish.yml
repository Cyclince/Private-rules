name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Cyclince/Private-rules'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version must use MAJOR.MINOR.PATCH with an optional prerelease suffix" >&2
            exit 1
          fi
          tags="cyclince/private-rules:${version}"
          is_prerelease="false"
          if [[ "$version" == *-* ]]; then
            is_prerelease="true"
            if [[ "$version" =~ -alpha(\.|$) ]]; then
              tags="${tags}"$'\n'"cyclince/private-rules:alpha"
            elif [[ "$version" =~ -beta(\.|$) ]]; then
              tags="${tags}"$'\n'"cyclince/private-rules:beta"
            fi
          else
            tags="${tags}"$'\n'"cyclince/private-rules:latest"
          fi
          {
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Update Docker Hub Repository overview
        if: steps.version.outputs.is_prerelease == 'false'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cyclince/private-rules
          short-description: Private self-hosted rules console for Cloudflare Workers and Docker Compose.
          readme-filepath: ./docs/dockerhub/README.md
          enable-url-completion: true
