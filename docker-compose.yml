services:
  private-rules:
    image: cyclince/private-rules:1.0.7 # 1.1.0 公测可改为 :1.1.0-beta.1（或 :beta）
    container_name: private-rules
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # 显式配置至少 32 位随机密钥（openssl rand -hex 32）；启用模板节点绑定时必需
      SESSION_SECRET: ${SESSION_SECRET:-}
      RULE_TOKEN: ${RULE_TOKEN:?Set RULE_TOKEN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      BASE_URL: ${BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    volumes:
      - private-rules-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  private-rules-data:
